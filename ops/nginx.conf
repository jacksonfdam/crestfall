# Static host for the production build (see docker-compose.yml).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Runtime configuration: never cached, so pointing the build at a different
    # Supabase project takes effect on reload rather than after a cache purge.
    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # A challenge link is /?join=CODE — a query on the root, not a path — so no
    # SPA rewrite is needed. Anything genuinely missing should still 404.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store";
    }
}
