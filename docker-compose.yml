# Local play: serves the production build the same way the host does, so the
# runtime /config.json path and the module MIME types are exercised for real
# rather than through the dev server.
#
# The Supabase stack is also Docker-based but managed by the Supabase CLI
# (`supabase start`), which is the officially supported way to run it locally.
# See docs/LOCAL_DEVELOPMENT.md for the full walkthrough.
services:
  web:
    image: nginx:1.27-alpine
    container_name: crestfall-web
    ports:
      - "8080:80"
    volumes:
      # Built by `npm run build`; `make web-up` runs that for you.
      - ./dist:/usr/share/nginx/html:ro
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
